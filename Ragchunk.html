<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunking Bench — how RAG cuts, embeds and retrieves a document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#08131C;
  --panel:#0D1E2B;
  --panel-2:#112635;
  --raise:#16303F;
  --rule:rgba(140,190,225,.14);
  --rule-hi:rgba(140,190,225,.28);
  --paper:#F6F2E8;
  --paper-2:#EAE4D6;
  --ink:#151F28;
  --ink-2:#5A6773;
  --amber:#FFB020;
  --cyan:#5FD0E8;
  --rose:#FF6B84;
  --text:#DBE8F2;
  --text-dim:#7C95AA;
  --text-faint:#4E6577;
  --c1:#2FBFA0; --c2:#7C86FF; --c3:#FF7BA9; --c4:#FFB020;
  --c5:#8CD44A; --c6:#4FB6F5; --c7:#FF8A5B; --c8:#C07BF0;
  --doc-fs:15.5px;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; height:100vh; min-height:0; overflow:hidden; display:flex; flex-direction:column;
  background:var(--ground); color:var(--text);
  font-family:var(--sans); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 14% -10%, rgba(60,120,165,.16), transparent 70%),
    radial-gradient(700px 420px at 96% 6%, rgba(255,176,32,.05), transparent 65%);
  background-attachment:fixed;
}
::selection{background:var(--amber); color:#10202C}

/* ---------- chrome ---------- */
.top{
  display:flex; align-items:center; gap:22px;
  padding:13px 22px; border-bottom:1px solid var(--rule); flex-wrap:wrap;
  background:rgba(8,19,28,.82); flex:0 0 auto; z-index:40;
}
.brand{display:flex; align-items:baseline; gap:11px; margin-right:auto}
.brand .mark{
  font-family:var(--mono); font-size:11px; letter-spacing:.16em; font-weight:600;
  color:#0B1A24; background:var(--amber); padding:3px 7px 2px; border-radius:2px;
}
.brand h1{
  margin:0; font-size:17px; font-weight:600; letter-spacing:-.015em;
}
.brand .sub{
  font-family:var(--mono); font-size:11px; color:var(--text-dim); letter-spacing:.04em;
}
.kbd-hint{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); letter-spacing:.03em}
.kbd-hint b{
  color:var(--text); font-weight:500; border:1px solid var(--rule-hi);
  border-bottom-width:2px; border-radius:3px; padding:1px 5px; margin:0 2px; background:var(--panel-2);
}
.toggles{display:flex; gap:8px}
.tg{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-dim); background:transparent; border:1px solid var(--rule);
  padding:6px 11px; border-radius:3px; cursor:pointer; transition:.16s;
}
.tg:hover{color:var(--text); border-color:var(--rule-hi)}
.tg[aria-pressed="true"]{color:#0B1A24; background:var(--amber); border-color:var(--amber); font-weight:600}
.tg:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}

/* ---------- stage ---------- */
.stage{
  display:grid;
  grid-template-columns:172px minmax(380px,1.02fr) 288px minmax(360px,.96fr);
  flex:1 1 auto; min-height:340px; overflow:hidden;
}
.col{overflow:hidden; min-height:0; height:100%; display:flex; flex-direction:column; border-right:1px solid var(--rule)}
.col:last-child{border-right:0}
.col-head{
  display:flex; align-items:center; gap:8px;
  padding:11px 15px 10px; border-bottom:1px solid var(--rule); flex:0 0 auto;
}
.col-head .eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.19em; text-transform:uppercase;
  color:var(--text-dim);
}
.col-head .count{
  margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--amber); letter-spacing:.05em;
}
.scroll{overflow-y:auto; overflow-x:hidden; flex:1 1 auto; min-height:0; scrollbar-width:thin; scrollbar-color:var(--raise) transparent}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--raise); border-radius:9px; border:3px solid var(--ground)}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- files ---------- */
.files{padding:8px 8px 20px}
.file{
  display:block; width:100%; text-align:left; background:transparent; border:0;
  border-left:2px solid transparent; padding:9px 10px; cursor:pointer;
  color:var(--text-dim); font-family:var(--mono); font-size:11.5px; line-height:1.35;
  transition:.14s; border-radius:0 3px 3px 0;
}
.file:hover{background:var(--panel); color:var(--text)}
.file[aria-current="true"]{background:var(--panel-2); color:var(--text); border-left-color:var(--amber)}
.file .fname{display:block; letter-spacing:-.01em}
.file .fmeta{display:block; font-size:9.5px; color:var(--text-dim); margin-top:3px; letter-spacing:.05em}
.file[aria-current="true"] .fmeta{color:var(--amber)}
.folder{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-dim); padding:12px 12px 7px;
}
.folder:first-child{padding-top:6px}

/* ---------- document sheet ---------- */
.docwrap{padding:20px 22px 60px; display:flex; flex-direction:column; gap:18px; align-items:center}
.sheet{
  width:100%; max-width:620px; background:var(--paper); color:var(--ink);
  border-radius:2px; padding:34px 38px 30px; position:relative;
  box-shadow:0 22px 46px -22px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06);
  font-family:var(--serif); font-size:var(--doc-fs); line-height:1.74;
}
.sheet::after{
  content:attr(data-page); position:absolute; right:16px; bottom:10px;
  font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:#A99F8A;
}
.sheet.plain{font-family:var(--mono); font-size:calc(var(--doc-fs) * .82); line-height:1.65}
.sheet h1{font-size:1.42em; line-height:1.28; margin:0 0 10px; font-weight:600; letter-spacing:-.01em}
.sheet h2{font-size:1.08em; margin:20px 0 7px; font-weight:600}
.sheet h3{font-size:.96em; margin:15px 0 5px; font-weight:600}
.sheet p{margin:0 0 11px}
.sheet .eyebrow-b{
  font-family:var(--mono); font-size:.63em; letter-spacing:.2em; text-transform:uppercase;
  color:#9A8F79; margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--paper-2);
}
.sheet .kv{font-family:var(--mono); font-size:.73em; margin:0 0 4px; color:#3A4652}
.sheet .mdh{font-family:var(--mono); font-weight:600; margin:16px 0 7px}
.sheet .mdh.l1{font-size:1.14em} .sheet .mdh.l2{font-size:.92em; color:#33414F}
.sheet .code{
  font-family:var(--mono); font-size:.78em; line-height:1.62; background:#ECE6D8;
  border-left:2px solid #C9BFA8; padding:9px 12px; margin:0 0 12px; white-space:pre-wrap;
  border-radius:0 2px 2px 0;
}
.sheet .code .ln{display:block; min-height:1.62em}
.sheet table{border-collapse:collapse; width:100%; margin:6px 0 12px; font-family:var(--mono); font-size:.75em}
.sheet caption{
  caption-side:top; text-align:left; font-family:var(--mono); font-size:.63em;
  letter-spacing:.14em; text-transform:uppercase; color:#9A8F79; padding-bottom:6px;
}
.sheet th{text-align:left; font-weight:600; border-bottom:1.5px solid #C9BFA8; padding:5px 7px 5px 0}
.sheet td{border-bottom:1px solid #DFD8C7; padding:5px 7px 5px 0; vertical-align:top}
.sheet tr:last-child td{border-bottom:0}
.sheet .ref{font-size:.82em; line-height:1.62; margin:0 0 9px; padding-left:36px; text-indent:-36px; color:#2C3843}
.sheet .ref .rn{font-family:var(--mono); font-weight:600; margin-right:10px; color:#8A7F68}
.sheet .foot{font-size:.8em; color:#5D5646; font-style:italic; margin-top:4px}

/* ---------- chunk paint ---------- */
.pt{border-radius:2px; padding:1px 0; transition:background .18s, box-shadow .18s}
.pt[data-c="0"]{background:color-mix(in srgb, var(--c1) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c1)}
.pt[data-c="1"]{background:color-mix(in srgb, var(--c2) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c2)}
.pt[data-c="2"]{background:color-mix(in srgb, var(--c3) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c3)}
.pt[data-c="3"]{background:color-mix(in srgb, var(--c4) 30%, transparent); box-shadow:inset 0 -2px 0 var(--c4)}
.pt[data-c="4"]{background:color-mix(in srgb, var(--c5) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c5)}
.pt[data-c="5"]{background:color-mix(in srgb, var(--c6) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c6)}
.pt[data-c="6"]{background:color-mix(in srgb, var(--c7) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c7)}
.pt[data-c="7"]{background:color-mix(in srgb, var(--c8) 26%, transparent); box-shadow:inset 0 -2px 0 var(--c8)}
.pt.ov{
  background-image:repeating-linear-gradient(135deg, rgba(21,31,40,.30) 0 3px, transparent 3px 7px);
}
.dim .pt{opacity:.24}
.dim .pt.focus{opacity:1}
.pt.focus{outline:2px solid var(--amber); outline-offset:1px; border-radius:2px}
.pt.pinned{outline:2px solid var(--cyan); outline-offset:2px}
/* measuring mode: the first chunk lights up so viewers see the span grow/shrink */
#doc.measuring .pt{opacity:.28}
#doc.measuring .pt.pinned,#doc.measuring .pt.focus{opacity:1;
  background:color-mix(in srgb, var(--amber) 34%, transparent) !important;
  outline:2px solid var(--amber); outline-offset:1px; border-radius:2px}
#measureBox{position:fixed; z-index:120; pointer-events:none; opacity:0; transform:translateY(-4px);
  transition:.12s; background:var(--panel); border:1px solid var(--amber); border-radius:5px;
  padding:8px 12px; font-family:var(--mono); font-size:12px; color:var(--text);
  box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}
#measureBox.on{opacity:1; transform:none}
#measureBox .mv{color:var(--amber); font-weight:600; font-size:15px}
#measureBox .mh{display:block; color:var(--text-dim); font-size:9.5px; letter-spacing:.05em; margin-top:3px; text-transform:uppercase}
#doc.retr .pt{opacity:.13}
#doc.retr .pt.hit{opacity:1}
/* hovering a chunk card must win over the retrieval dimming, whether or
   not that chunk was one of the hits — order matters on the last two */
#doc.retr.dim .pt.hit{opacity:.2}
#doc.retr.dim .pt.focus2{opacity:.62}
#doc.retr.dim .pt.focus,
#doc.retr.dim .pt.pinned{opacity:1}
#doc.retr .pt.pinned{opacity:1}
.pt.hit{outline:2px solid var(--amber); outline-offset:2px; border-radius:2px}
.cut.rank b{left:-11px; padding:2px 5px; font-size:9.5px}
.pt.focus2{outline:1px dashed rgba(95,208,232,.75); outline-offset:1px}

/* cut markers */
.cut{position:relative; display:inline-block; width:0; height:0; vertical-align:baseline}
.cut i{
  position:absolute; left:-1px; top:-1.05em; height:1.75em; width:2px;
  background:var(--amber); border-radius:1px; box-shadow:0 0 7px rgba(255,176,32,.85);
}
.cut b{
  position:absolute; left:-8px; top:-2.35em; font-family:var(--mono); font-size:8.5px; font-weight:600;
  color:#0B1A24; background:var(--amber); padding:1px 4px; border-radius:2px; line-height:1.4;
}
.cut.labelled b{left:-6px; top:-2.5em; font-size:8px; letter-spacing:.02em; white-space:nowrap;
  background:var(--cyan); color:#062028; box-shadow:0 0 6px rgba(95,208,232,.35)}
.cut.labelled i{background:var(--cyan); box-shadow:0 0 6px rgba(95,208,232,.6)}
.cut.sev i{background:var(--rose); box-shadow:0 0 8px rgba(255,107,132,.9)}
.cut.sev b{background:var(--rose); color:#2A0910}
.cut.b i{background:var(--cyan); top:-.35em; height:1.6em; opacity:.9; box-shadow:0 0 6px rgba(95,208,232,.7)}
.cut.b b{top:1.05em; background:var(--cyan); color:#062028}
.animate .cut i{animation:drop .34s cubic-bezier(.2,.8,.2,1) backwards}
.animate .cut b{animation:fade .4s ease .1s backwards}
@keyframes drop{from{transform:scaleY(0); opacity:0} to{transform:scaleY(1); opacity:1}}
@keyframes fade{from{opacity:0; transform:translateY(-3px)} to{opacity:1}}

/* ---------- strategy list ---------- */
.strat-group{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.19em; text-transform:uppercase;
  color:var(--text-dim); padding:15px 15px 6px; display:flex; align-items:center; gap:9px;
}
.strat-group::after{content:""; flex:1; height:1px; background:var(--rule)}
.strat{
  width:100%; text-align:left; background:transparent; border:0; border-left:2px solid transparent;
  padding:8px 14px; cursor:pointer; color:var(--text-dim); transition:.14s; display:block;
}
.strat:hover{background:var(--panel); color:var(--text)}
.strat[aria-current="true"]{background:var(--panel-2); border-left-color:var(--amber); color:var(--text)}
.strat.pinned{border-left-color:var(--cyan)}
.strat-row{display:flex; align-items:baseline; gap:8px}
.strat .nm{font-size:13px; font-weight:500; letter-spacing:-.01em}
.strat[aria-current="true"] .nm{font-weight:600}
.strat .n{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--text-dim); flex:0 0 auto}
.strat[aria-current="true"] .n{color:var(--amber)}
.strat.pinned .n{color:var(--cyan)}
.strat .bl{font-size:11px; color:var(--text-dim); margin-top:2px; display:none; line-height:1.45}
.strat[aria-current="true"] .bl{display:block}

.params{padding:4px 14px 14px; background:var(--panel-2); border-left:2px solid var(--amber)}
.prm{display:grid; grid-template-columns:76px 1fr 52px; align-items:center; gap:8px; margin-top:9px}
.prm label{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prm input[type=range]{width:100%; min-width:0; accent-color:var(--amber); height:4px}
.prm .val{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--amber); text-align:right; white-space:nowrap}
.when{
  margin-top:12px; padding-top:10px; border-top:1px solid var(--rule);
  font-size:11px; line-height:1.5; color:var(--text-dim);
}
.when strong{color:var(--text); font-weight:600; display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:4px}

/* ---------- right: chunks ---------- */
.stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule);
  border-bottom:1px solid var(--rule); flex:0 0 auto;
}
.stat{background:var(--ground); padding:9px 12px}
.stat .k{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim)}
.stat .v{font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:-.02em; margin-top:1px}
.stat.warn .v{color:var(--rose)}
.stat.good .v{color:var(--c1)}

.chunks{padding:12px 14px 60px; display:flex; flex-direction:column; gap:9px}
.chunk{
  border:1px solid var(--rule); border-left:3px solid var(--cc,var(--c1)); border-radius:3px;
  background:var(--panel); overflow:hidden; transition:.16s;
}
.chunk:hover{border-color:var(--rule-hi); background:var(--panel-2)}
.chunk.open{background:var(--panel-2); border-color:var(--rule-hi)}
.chunk-head{display:flex; align-items:center; gap:9px; padding:8px 11px; cursor:pointer; width:100%; background:none; border:0; text-align:left; flex-wrap:wrap}
.chunk-head:focus-visible{outline:2px solid var(--cyan); outline-offset:-2px}
.chunk-id{font-family:var(--mono); font-size:10px; font-weight:600; color:var(--cc,var(--c1)); letter-spacing:.06em}
.chunk-label{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.02em;
  color:#0B1A24; background:var(--cc,var(--c1)); padding:2px 8px; border-radius:3px; white-space:nowrap}
.chunk-tags{display:flex; gap:5px; margin-left:auto; align-items:center}
.tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; color:var(--text-dim);
  border:1px solid var(--rule); padding:1px 5px; border-radius:2px;
}
.tag.hot{color:var(--amber); border-color:rgba(255,176,32,.45)}
.tag.bad{color:var(--rose); border-color:rgba(255,107,132,.45)}
.tag.ok{color:var(--c1); border-color:rgba(47,191,160,.4)}
.chunk-body{padding:0 11px 10px; font-family:var(--serif); font-size:13.5px; line-height:1.6; color:#C6D6E2}
.chunk-body .ctx{
  display:block; font-family:var(--mono); font-size:10.5px; line-height:1.5; color:var(--amber);
  background:rgba(255,176,32,.07); border-left:2px solid var(--amber);
  padding:6px 8px; margin:0 0 8px; border-radius:0 2px 2px 0; font-style:normal;
}
.chunk-body .win{color:var(--text-dim)}
.chunk-body .mono{font-family:var(--mono); font-size:11px; white-space:pre-wrap}
.chunk-note{
  font-family:var(--mono); font-size:10px; color:var(--cyan); padding:0 11px 9px;
  display:flex; gap:6px; align-items:flex-start; line-height:1.5;
}
.chunk-note::before{content:"↳"; opacity:.7}

/* embedding */
.emb{border-top:1px solid var(--rule); padding:10px 11px 12px; background:rgba(0,0,0,.18)}
.emb-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.emb-head .t{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-dim)}
.emb-head .d{margin-left:auto; font-family:var(--mono); font-size:9.5px; color:var(--cyan)}
.vec{display:grid; grid-template-columns:repeat(6,1fr); gap:3px 6px; font-family:var(--mono); font-size:11px}
.vec span{color:#8FB4CB; text-align:right; letter-spacing:-.02em}
.vec span.neg{color:#B58AA8}
.heat{display:flex; gap:1px; height:26px; margin-top:9px; align-items:center}
.heat i{flex:1; background:var(--cyan); border-radius:.5px; min-height:1px; opacity:.85}
.emb-foot{
  display:flex; gap:14px; margin-top:9px; font-family:var(--mono); font-size:10px; color:var(--text-dim);
  flex-wrap:wrap;
}
.emb-foot b{color:var(--text); font-weight:500}

/* compare */
.cmp[hidden],.scroll[hidden]{display:none}
.cmp{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); flex:1 1 auto; overflow:hidden}
.cmp > div{background:var(--ground); overflow-y:auto; padding:0}
.cmp-h{
  position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--rule);
  padding:8px 12px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; z-index:2;
}
.cmp-h.a{color:var(--amber)} .cmp-h.b{color:var(--cyan)}
.cmp .chunks{padding:10px 10px 40px; gap:6px}
.cmp .chunk-body{font-size:11.5px; padding-bottom:8px}

/* code panel */
.codepanel{
  border-top:1px solid var(--rule); background:#061019; flex:0 0 auto; max-height:38%;
  overflow:auto; display:none;
}
.codepanel.on{display:block}
.codepanel .ch{
  display:flex; align-items:center; gap:8px; padding:8px 13px; border-bottom:1px solid var(--rule);
  position:sticky; top:0; background:#061019;
}
.codepanel .ch span{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-dim)}
.codepanel .ch em{margin-left:auto; font-family:var(--mono); font-size:9.5px; color:var(--cyan); font-style:normal}
.codepanel pre{
  margin:0; padding:12px 15px 16px; font-family:var(--mono); font-size:11.5px; line-height:1.65;
  color:#9FBDD2; white-space:pre-wrap; tab-size:2;
}
.codepanel .kw{color:var(--c2)} .codepanel .str{color:var(--c5)}
.codepanel .cm{color:#4C6373; font-style:italic} .codepanel .fn{color:var(--amber)}
.codepanel .num{color:var(--c7)}


/* ---------- retrieval drawer ---------- */
.drawer{flex:1 1 44vh; min-height:300px; max-height:52vh; border-top:1px solid var(--rule-hi);
  background:var(--panel); display:flex; flex-direction:column}
.drawer[hidden]{display:none}
.qbar{display:flex; align-items:center; gap:11px; padding:11px 15px 9px}
.qlab{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim)}
.qbar input[type=text]{flex:1; min-width:120px; background:var(--ground); border:1px solid var(--rule-hi);
  border-radius:3px; color:var(--text); font-family:var(--sans); font-size:14.5px; padding:9px 12px}
.qbar input[type=text]:focus{outline:none; border-color:var(--amber)}
.qbar input[type=text]::placeholder{color:var(--text-faint)}
.ktop{font-family:var(--mono); font-size:10px; color:var(--text-dim);
