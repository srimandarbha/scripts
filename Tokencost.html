<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Cost Lab — Beat the Bill | nitmonk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1116; --ink-2:#1A1F27; --paper:#FBFAF7; --panel:#FFFFFF;
  --line:#E3E0D8; --line-2:#D2CEC3; --muted:#6C7280; --muted-2:#9AA0A8;
  --bad:#C0392B; --bad-bg:#FDF1EF; --good:#1E7A4C; --good-bg:#EFF7F1;
  --accent:#2F3BB3; --accent-bg:#EEF0FC; --warn:#B4761A;
  --gold:#C9992B; --xp:#7C3AED;
  --code-bg:#12151B; --r:10px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
::selection{background:#DDE1FA}

/* ambient bg */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* ---------- SIDEBAR ---------- */
.sidebar{width:300px;flex:0 0 300px;border-right:1px solid var(--line);background:#F6F4EF;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:5}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.brand .ch{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{font-family:var(--disp);font-size:19px;line-height:1.2;margin:6px 0 0;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:4px}

/* player card in sidebar */
.player{padding:13px 16px;border-bottom:1px solid var(--line);background:#F1EFE8}
.plrow{display:flex;align-items:center;gap:10px}
.lvlbadge{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--xp),#9D5BF0);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:17px;flex:0 0 38px;box-shadow:0 2px 6px rgba(124,58,237,.35)}
.plinfo{flex:1;min-width:0}
.plinfo .rank{font-family:var(--disp);font-size:13.5px;font-weight:700;line-height:1.1}
.plinfo .xpn{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.xpbar{height:5px;background:#E1DED6;border-radius:3px;margin-top:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#A56BF2);width:0;border-radius:3px;transition:width .6s cubic-bezier(.2,.7,.3,1)}

.searchbox{padding:11px 16px 9px;border-bottom:1px solid var(--line)}
.searchbox input{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;font-family:var(--body);font-size:13px;background:#fff;color:var(--ink)}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.navscroll{overflow-y:auto;flex:1;padding-bottom:20px}
.groupwrap{padding:11px 12px 4px}
.grouphead{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:0 8px 7px;font-weight:600}
.gitem{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-2)}
.gbadge{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:#fff;font-weight:600;flex:0 0 16px}
.divline{height:1px;background:var(--line);margin:7px 16px}
.navlist{padding:4px 12px}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;text-align:left;border-radius:7px;color:var(--ink-2);border-left:3px solid transparent;transition:background .12s}
.nav-i:hover{background:#EDEAE2}
.nav-i.on{background:#E7E9F9;border-left-color:var(--accent);color:var(--accent)}
.nav-i .n{font-family:var(--mono);font-size:11px;color:var(--muted-2);flex:0 0 18px}
.nav-i.on .n{color:var(--accent)}
.nav-i .t{font-size:12.6px;font-weight:600;line-height:1.25;flex:1}
.nav-i .status{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;font-size:11px}
.nav-i .status .done{color:var(--good);font-weight:700}
.nav-i .status .lock{color:var(--muted-2)}
.navfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.navfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.kbdhint{font-family:var(--mono);font-size:9.5px;color:var(--muted-2)}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;padding:0 0 90px;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:0 34px}

/* MISSION BAR (sticky top) */
.mission{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:1px solid #000}
.mission .wrap{display:flex;align-items:center;gap:22px;padding:10px 34px}
.mgroup{display:flex;flex-direction:column;gap:1px}
.mgroup .ml{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8B949E;font-weight:600}
.mgroup .mv{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mv.cost{color:#FF8B7E}
.mv.target{color:#67D998}
.mv.score{color:#E8C15A}
.mprog{flex:1;min-width:90px}
.mprog .track{height:9px;background:#2A303A;border-radius:5px;overflow:hidden;position:relative}
.mprog .track i{display:block;height:100%;background:linear-gradient(90deg,#1E7A4C,#48C07E);width:0;border-radius:5px;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.mprog .pct{font-family:var(--mono);font-size:10px;color:#8B949E;margin-top:3px;display:flex;justify-content:space-between}
.mtabs{display:flex;gap:3px;background:#1A1F27;padding:3px;border-radius:9px}
.mtab{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:#8B949E}
.mtab.on{background:#fff;color:var(--ink)}
.pager{display:flex;align-items:center;gap:7px}
.pgbtn{width:29px;height:29px;border:1px solid #2A303A;background:#1A1F27;border-radius:7px;font-size:14px;color:#C9D1D9;display:grid;place-items:center}
.pgbtn:hover:not(:disabled){background:#252C37}
.pgbtn:disabled{opacity:.3;cursor:not-allowed}
.pgnum{font-family:var(--mono);font-size:11px;color:#8B949E;min-width:46px;text-align:center}

.mobnav{display:none}

/* ---------- LESSON CARD ---------- */
.card{margin-top:22px}
.chapline{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:3px}
.chead{background:var(--accent-bg);border:1px solid #D6DAF6;border-radius:var(--r);padding:19px 22px 20px;border-bottom:3px solid var(--accent)}
.chead .kicker{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chead .chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:5px;font-weight:600}
.chip.cat{background:#fff;color:var(--accent);border:1px solid #D6DAF6}
.chip.xp{background:#F1EBFD;color:var(--xp);border:1px solid #E2D3FA}
.chead h2{font-family:var(--disp);font-size:29px;line-height:1.08;margin:0 0 9px;letter-spacing:-.025em;font-weight:700}
.chead .story{font-family:var(--disp);font-size:15px;color:var(--accent);font-weight:600;font-style:italic;margin:0 0 6px}
.chead .lede{font-size:15px;color:var(--ink-2);max-width:80ch;margin:0}

/* step flow */
.steps{display:flex;align-items:center;gap:0;margin:16px 0 4px;flex-wrap:wrap}
.stepdot{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stepdot .b{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:10px;color:var(--muted-2);background:#fff;transition:all .3s}
.stepdot.done .b{background:var(--good);border-color:var(--good);color:#fff}
.stepdot.active .b{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.stepdot.active{color:var(--accent)}
.stepsep{width:22px;height:2px;background:var(--line);margin:0 7px}
.stepsep.done{background:var(--good)}

/* stage blocks that unlock */
.stage{margin-top:16px;opacity:0;max-height:0;overflow:hidden;transition:opacity .5s,max-height .6s ease}
.stage.show{opacity:1;max-height:4000px}
.stage.locked-note{opacity:1;max-height:200px}

/* run row */
.runrow{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.runbtn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:13px 24px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 3px 10px rgba(14,17,22,.2)}
.runbtn:hover:not(:disabled){background:#25303F;transform:translateY(-1px)}
.runbtn:disabled{opacity:.55;cursor:progress}
.runbtn.big{padding:15px 34px;font-size:17px}
.hint{font-size:13px;color:var(--muted);font-style:italic;flex:1;min-width:200px}
.ghostbtn{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:10px 15px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ghostbtn:hover{background:#F0EEE8}

/* split simulation */
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.side h4{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 8px;font-weight:600}
.side.bad h4{color:var(--bad)}
.side.good h4{color:var(--good)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;height:100%}
.side.bad .pane{border-color:#EFD6D2}
.side.good .pane{border-color:#CFE5D8}
.viz{min-height:150px;display:flex;flex-direction:column;justify-content:center}
.vizcap{font-size:11.5px;color:var(--muted);margin-top:9px;font-family:var(--mono)}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:15px 0 13px}
.m .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.m .val{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.1;margin-top:2px;letter-spacing:-.02em}
.m .val small{font-size:12px;font-weight:600;margin-left:1px}
.side.bad .m .val{color:var(--bad)}
.side.good .m .val{color:var(--good)}
.bar{height:3px;background:#E8E5DE;border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:2px;transition:width .55s cubic-bezier(.2,.7,.3,1)}
.side.bad .bar i{background:var(--bad)}
.side.good .bar i{background:var(--good)}
.term{background:var(--code-bg);border-radius:8px;padding:13px 14px;font-family:var(--mono);font-size:12px;line-height:1.75;min-height:116px}
.tl{display:flex;gap:11px;opacity:0;transform:translateY(3px);animation:tin .3s forwards}
@keyframes tin{to{opacity:1;transform:none}}
.tl .ln{color:#4A5361;flex:0 0 17px;text-align:right;user-select:none}
.tl .tx{color:#C9D1D9;white-space:pre-wrap;word-break:break-word}
.tl.r .tx{color:#FF8B7E}.tl.g .tx{color:#67D998}.tl.y .tx{color:#E8B84B}.tl.d .tx{color:#8B949E}
.cursor{display:inline-block;width:7px;height:14px;background:#67D998;vertical-align:-2px;animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* what happened / code / impact */
.lower{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-top:18px;align-items:start}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px}
.blk h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 11px;font-weight:600}
.whath{font-size:14.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.6}
.buildlist{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.buildlist li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.buildlist .dot{width:5px;height:5px;border-radius:50%;background:var(--good);margin-top:8px;flex:0 0 5px}
.impact{background:var(--accent-bg);border-color:#D6DAF6}
.impact .big{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.savechip{display:inline-flex;align-items:center;gap:6px;margin-top:13px;background:#fff;border:1px solid #CFE5D8;border-radius:99px;padding:5px 12px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--good)}
.techrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.tech{font-family:var(--mono);font-size:11px;background:#F2F0EA;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink-2)}
.protip{margin-top:12px}
.protipbtn{border:1px solid #E2D3FA;background:#F7F2FE;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--xp);display:inline-flex;gap:7px;align-items:center}
.protipbody{margin-top:9px;font-size:13.5px;color:var(--ink-2);background:#FBF8FF;border:1px solid #EEE3FB;border-radius:8px;padding:12px 14px;line-height:1.55;display:none}
.protipbody.show{display:block}

/* code */
.codeblk{margin-top:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.codehead{background:#F2F0EA;padding:9px 15px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;font-weight:600}
.copybtn{margin-left:auto;border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.copybtn:hover{background:#EDEAE2}
pre.code{margin:0;background:var(--code-bg);color:#C9D1D9;padding:15px 17px;font-family:var(--mono);font-size:12.5px;line-height:1.68;overflow-x:auto}
.code .k{color:#FF7B95}.code .s{color:#A5D6FF}.code .c{color:#7D8590;font-style:italic}.code .f{color:#D2A8FF}.code .n{color:#79C0FF}.code .cm{color:#FFA657}

/* cliffhanger */
.cliff{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px 24px;margin-top:18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cliff .ct{flex:1;min-width:240px}
.cliff .cl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B949E;font-weight:600}
.cliff .cx{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.35;margin-top:6px}
.cliff .cx em{color:#67D998;font-style:normal}
.cliff .nextbtn{background:#fff;color:var(--ink);border:0;border-radius:9px;padding:13px 22px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cliff .nextbtn:hover{background:#E8E9F5}

/* quiz */
.quizcard{background:#FFFBF3;border:1px solid #EAD9B0;border-radius:var(--r);padding:18px 20px;margin-top:18px}
.quizcard h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--warn);margin:0 0 10px;font-weight:600}
.quizq{font-family:var(--disp);font-size:16px;font-weight:600;margin:0 0 13px}
.quizopts{display:grid;gap:8px}
.qopt{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:11px 14px;font-size:13.5px;text-align:left;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.qopt:hover{border-color:var(--warn)}
.qopt .qk{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;flex:0 0 16px}
.qopt.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:600}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.quizfb{margin-top:11px;font-size:13.5px;font-weight:600;min-height:20px}

/* locked note */
.locknote{background:#F6F4EF;border:1px dashed var(--line-2);border-radius:var(--r);padding:16px 20px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.locknote .lk{font-size:16px}

/* toast + achievements */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:13px;min-width:240px;max-width:340px;transform:translateX(120%);animation:tin2 .45s cubic-bezier(.2,.9,.3,1) forwards;border:1px solid #2A303A}
@keyframes tin2{to{transform:none}}
.toast.out{animation:tout .4s forwards}
@keyframes tout{to{transform:translateX(120%);opacity:0}}
.toast .ic{font-size:26px;flex:0 0 auto}
.toast .tt{font-family:var(--disp);font-size:14px;font-weight:700;line-height:1.2}
.toast .td{font-size:12px;color:#8B949E;margin-top:2px}
.toast.gold{border-color:var(--gold)}
.toast.gold .tt{color:#F0C14B}

/* confetti canvas */
#confetti{position:fixed;inset:0;z-index:190;pointer-events:none}

/* celebration overlay */
#celebrate{position:fixed;inset:0;z-index:180;background:rgba(14,17,22,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center}
#celebrate.show{display:flex}
.celbox{background:#fff;border-radius:18px;padding:34px 40px;text-align:center;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.celbox .emoji{font-size:52px}
.celbox h3{font-family:var(--disp);font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.celbox .big{font-family:var(--disp);font-size:40px;font-weight:700;color:var(--good);letter-spacing:-.03em;margin:6px 0}
.celbox p{color:var(--muted);font-size:14px;margin:6px 0 18px}
.celbox button{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:14px;font-weight:600}

/* ---------- OVERVIEW / CALC ---------- */
.hero{padding:40px 0 26px;border-bottom:1px solid var(--line)}
.hero .kick{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h2{font-family:var(--disp);font-size:44px;line-height:1.04;letter-spacing:-.035em;margin:12px 0 14px;font-weight:700;max-width:20ch}
.hero p{font-size:16px;color:var(--muted);max-width:62ch;margin:0}
.hero .strike{color:var(--ink);font-weight:600}
.startbtn{margin-top:22px;background:var(--ink);color:#fff;border:0;border-radius:11px;padding:15px 30px;font-size:16px;font-weight:700;display:inline-flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(14,17,22,.22)}
.startbtn:hover{background:#25303F;transform:translateY(-1px)}
.calcgrid{display:grid;grid-template-columns:1fr 400px;gap:26px;margin-top:30px;align-items:start}
.ctrl{margin-bottom:16px}
.ctrl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.ctrl label b{font-family:var(--mono);color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.selrow{display:flex;gap:6px;flex-wrap:wrap}
.selrow button{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.selrow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.billcard{background:var(--ink);color:#fff;border-radius:12px;padding:24px;position:sticky;top:74px}
